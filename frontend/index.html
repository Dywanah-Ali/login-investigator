<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved appearance before the app paints. Keep the key/modes in sync with lib/theme.ts. -->
    <script>
      (() => {
        let theme = 'system'
        try {
          const saved = localStorage.getItem('login-investigator-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') theme = saved
        } catch {}
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
      })()
    </script>
    <title>Login Investigator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
