[project]
name = "login-investigator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "fpdf2==2.8.9",
    "langchain==1.3.1",
    "langchain-core==1.4.0",
    "langchain-openai==1.2.2",
    "langchain-postgres==0.0.19",
    "langchain-text-splitters==1.1.2",
    "langfuse==5.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "neo4j==6.1.0",
    "pandas>=3.0.6",
    "psycopg[binary]==3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy==2.1.6",
    "tiktoken==0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf==6.20.0",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "ruff==0.17.3",
]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py312"
unsafe-fixes = false

[tool.ruff.lint]
# Keep the pinned version's default checks, plus explicit import ordering.
# AUD-013: relax these reviewed style preferences, not correctness checks.
extend-select = ["I"]
ignore = [
    "UP017",    # timezone.utc is already explicit and supported.
    "SIM117",   # Nested contexts can make resource ownership clearer.
    "SIM102",   # Nested conditions can make validation steps clearer.
    "SIM113",   # Explicit counters are allowed.
    "FURB167",  # Both short and long regex flag names are allowed.
    "FURB162",  # Explicit UTC suffix normalization is allowed.
    "FURB192",  # Sorting before selecting a value is allowed.
    "RUF007",   # Adjacent-pair zip expressions are allowed.
    "RUF015",   # Materializing small test results is allowed.
    "ASYNC115", # Existing sleep(0) scheduling checkpoints are allowed.
    "C405",     # Explicit set construction is allowed.
    "B009",     # Constant getattr is allowed for dynamically typed objects.
]

[tool.pyright]
include = ["login_investigator", "api", "tests", "evals", "scripts", "conftest.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# Not yet checked: files copied from v1 that Pyright flagged on 14 Oct 2026 (61 errors, mostly
# pandas types it cannot follow). They stay unchanged until Parity is proven. A file leaves this
# list only once `uv run pyright` is clean with it removed, so the list can only shrink. New files
# never go on it. Ticket 21; spec decisions log, 14 Oct.
ignore = [
    "login_investigator/agent.py",
    "login_investigator/generator.py",
    "login_investigator/loader.py",
    "login_investigator/report_pdf.py",
    "login_investigator/rules.py",
    "login_investigator/search.py",
    "login_investigator/stats.py",
    "login_investigator/tool_views.py",
    "login_investigator/tools.py",
    "tests/test_agent.py",
    "tests/test_report_pdf.py",
    "tests/test_stats.py",
    "tests/test_tool_views.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
